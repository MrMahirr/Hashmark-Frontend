# Docker log rotasyonu (veri saklama politikası): konteyner başına en fazla 5 × 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # === Frontend (Next.js) ===
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    container_name: hashmark_frontend
    logging: *default-logging
    restart: unless-stopped
    networks:
      - hashmark-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # === Nginx Reverse Proxy ===
  nginx:
    image: nginx:alpine
    container_name: hashmark_nginx
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - hashmark-network
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider --tries=1 --header=\"Host: hashmark.yunusemremahir.com.tr\" http://127.0.0.1:80/ 2>&1 | grep -qE \"HTTP/1.1 (200|301|302)\""]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  hashmark-network:
    name: hashmark-network
    external: true
